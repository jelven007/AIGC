[auth.email]
enable_confirmations = false

# 支付平台回调不携带 Supabase JWT，在函数内校验支付签名。
[functions.alipay-payment-notify]
verify_jwt = false

[functions.wechat-payment-webhook]
verify_jwt = false

# 由后台调度器使用专用 VIDEO_WORKER_SECRET 鉴权。
[functions.video-job-worker]
verify_jwt = false

# 专用调度/渲染密钥在函数内鉴权，OAuth 回调使用一次性 state。
[functions.production-worker]
verify_jwt = false

[functions.platform-oauth-callback]
verify_jwt = false

# 业务函数同时验证用户 JWT 或有权限/限额的 API Key。
[functions.text-generation]
verify_jwt = false

[functions.video-jobs]
verify_jwt = false

[functions.batch-video-jobs]
verify_jwt = false

[functions.production-jobs]
verify_jwt = false

[functions.platform-publish]
verify_jwt = false

[functions.measurements]
verify_jwt = false

[functions.knowledge-base]
verify_jwt = false

[functions.market-intelligence]
verify_jwt = false

# 授权采集服务使用HMAC原始正文签名，不使用用户JWT。
[functions.measurement-ingest]
verify_jwt = false
