name: ${COMPOSE_PROJECT_NAME}
x-common: &common
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
  pids_limit: 256

services:
  db:
    <<: *common
    image: ${DB_IMAGE}
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      POSTGRES_USER: supabase_admin
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_PORT: 5432
      PGPORT: 5432
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: 3600
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-shopro-roles.sql:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_min_messages=warning",
      "-c", "max_connections=${DB_MAX_CONNECTIONS:-100}", "-c", "shared_buffers=${DB_SHARED_BUFFERS:-128MB}",
      "-c", "effective_cache_size=${DB_EFFECTIVE_CACHE_SIZE:-1GB}", "-c", "work_mem=${DB_WORK_MEM:-4MB}",
      "-c", "maintenance_work_mem=${DB_MAINTENANCE_WORK_MEM:-64MB}"]
    shm_size: ${DB_SHM_SIZE:-256m}
    mem_limit: ${DB_MEMORY:-2g}
    cpus: ${DB_CPUS:-2}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 30

  auth:
    <<: *common
    image: ${AUTH_IMAGE}
    depends_on: {db: {condition: service_healthy}}
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_API_MAX_REQUEST_DURATION: ${AUTH_REQUEST_TIMEOUT:-10s}
      API_EXTERNAL_URL: ${PUBLIC_ORIGIN}/auth/v1
      GOTRUE_SITE_URL: ${PUBLIC_ORIGIN}
      GOTRUE_URI_ALLOW_LIST: ${PUBLIC_ORIGIN}/**
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_DB_MAX_POOL_SIZE: ${AUTH_DB_POOL:-10}
      GOTRUE_DB_MAX_IDLE_POOL_SIZE: ${AUTH_DB_IDLE_POOL:-10}
      GOTRUE_DB_CONN_MAX_LIFETIME: ${AUTH_DB_CONN_LIFETIME:-30m}
      GOTRUE_DB_CONN_MAX_IDLE_TIME: ${AUTH_DB_CONN_IDLE_TIME:-5m}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PORT: ${SMTP_PORT}
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_SENDER_NAME: Shopro
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
    mem_limit: ${AUTH_MEMORY:-256m}
    cpus: ${AUTH_CPUS:-0.5}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 30

  rest:
    <<: *common
    image: ${REST_IMAGE}
    depends_on: {db: {condition: service_healthy}}
    environment:
      # Haskell默认按宿主核数建线程；64核ECS的额外就绪进程会超过256 PID上限。
      GHCRTS: -N${REST_THREADS:-1}
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_MAX_ROWS: 1000
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_ADMIN_SERVER_HOST: localhost
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_DB_POOL: ${REST_DB_POOL:-10}
    read_only: true
    mem_limit: ${REST_MEMORY:-256m}
    cpus: ${REST_CPUS:-0.5}
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 5s
      timeout: 5s
      retries: 30

  storage:
    <<: *common
    image: ${STORAGE_IMAGE}
    depends_on: {db: {condition: service_healthy}, rest: {condition: service_started}}
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      AUTH_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      DATABASE_POOL_SIZE: ${STORAGE_DB_POOL:-10}
      STORAGE_PUBLIC_URL: ${PUBLIC_ORIGIN}
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      FILE_SIZE_LIMIT: 524288000
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      GLOBAL_S3_BUCKET: shopro
      TENANT_ID: shopro
      REGION: local
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes: ["storage:/var/lib/storage"]
    mem_limit: ${STORAGE_MEMORY:-512m}
    cpus: ${STORAGE_CPUS:-1}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5000/status"]
      interval: 5s
      timeout: 5s
      retries: 30

  realtime:
    <<: *common
    image: ${REALTIME_IMAGE}
    depends_on: {db: {condition: service_healthy}}
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: postgres
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_AFTER_CONNECT_QUERY: SET search_path TO _realtime
      DB_ENC_KEY: ${REALTIME_DB_ENC_KEY}
      API_JWT_SECRET: ${JWT_SECRET}
      ANON_KEY: ${ANON_KEY}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      METRICS_JWT_SECRET: ${JWT_SECRET}
      ERL_AFLAGS: -proto_dist inet_tcp
      ERL_FLAGS: "+S ${REALTIME_THREADS:-2}:${REALTIME_THREADS:-2}"
      DNS_NODES: "''"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
      RLIMIT_NOFILE: "10000"
    mem_limit: ${REALTIME_MEMORY:-768m}
    cpus: ${REALTIME_CPUS:-1}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf --head -H \"Authorization: Bearer $$ANON_KEY\" http://127.0.0.1:4000/api/tenants/realtime-dev/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5

  functions:
    <<: *common
    image: ${FUNCTIONS_IMAGE}
    entrypoint: ["bash", "-c", "export SELF_HOSTED_CA_PEM=\"$$(cat /run/tls/ca.crt)\"; exec edge-runtime \"$$@\"", "edge-runtime"]
    command: ["start", "--verbose", "--disable-module-cache", "--user-worker-request-idle-timeout", "150000", "--main-service", "/home/deno/main"]
    depends_on: {db: {condition: service_healthy}}
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SUPABASE_URL: ${PUBLIC_ORIGIN}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      VIDEO_WORKER_SECRET: ${VIDEO_WORKER_SECRET}
      RENDER_WORKER_SECRET: ${RENDER_WORKER_SECRET}
      MODEL_CONFIG_KEYRING: ${MODEL_KEYRING}
      SELF_HOSTED_BACKEND_ORIGIN: ${PUBLIC_ORIGIN}
      SELF_HOSTED_BACKEND_IPS: ${BACKEND_ALLOWED_IPS:-${BACKEND_IP}}
      SELF_HOSTED_CA_FILE: /run/tls/ca.crt
    extra_hosts: ["${PUBLIC_HOST}:${BACKEND_IP}"]
    volumes:
      - ${STATE_DIR}/edge:/home/deno/functions:ro
      - ${SOURCE_DIR}:/workspace:ro
      - ./main:/home/deno/main:ro
      - ./deno.json:/home/deno/deno.json:ro
      - ${SOURCE_DIR}/infra/volcengine/manifest.json:/home/deno/manifest.json:ro
      - ${STATE_DIR}/tls/ca.crt:/run/tls/ca.crt:ro
      - deno-cache:/root/.cache/deno
      - ${STATE_DIR}/login-identity.json:/run/bootstrap/login-identity.json:ro
    # 43个冻结业务入口在x86 V8中全量加载超过1GiB；保留有界4GiB总预算。
    mem_limit: ${FUNCTIONS_MEMORY:-4g}
    cpus: ${FUNCTIONS_CPUS:-2}
    stop_grace_period: 160s
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/9000'"]
      interval: 5s
      timeout: 5s
      retries: 30

  proxy:
    <<: *common
    image: ${PROXY_IMAGE}
    ulimits:
      nofile: {soft: 8192, hard: 8192}
    user: "101:101"
    entrypoint: ["sh", "-c", "envsubst '$$PUBLIC_HOST $$HTTPS_PORT $$ANON_KEY' < /etc/nginx/templates/default.conf.template > /tmp/default.conf && exec nginx -c /etc/nginx/shopro.conf -g 'daemon off;'"]
    depends_on:
      auth: {condition: service_healthy}
      rest: {condition: service_healthy}
      storage: {condition: service_healthy}
      functions: {condition: service_healthy}
      realtime: {condition: service_started}
    ports: ["${BIND_ADDRESS}:${HTTPS_PORT}:${HTTPS_PORT}"]
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
      HTTPS_PORT: ${HTTPS_PORT}
      ANON_KEY: ${ANON_KEY}
      NGINX_ENVSUBST_FILTER: "^(PUBLIC_HOST|HTTPS_PORT|ANON_KEY)$"
    networks:
      default: {ipv4_address: "${BACKEND_IP}", aliases: ["${PUBLIC_HOST}"]}
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx.conf:/etc/nginx/shopro.conf:ro
      - ${STATE_DIR}/frontend:/site:ro
      - certificates:/certs:ro
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m,uid=101,gid=101"]
    cap_drop: [ALL]
    mem_limit: ${PROXY_MEMORY:-128m}
    cpus: ${PROXY_CPUS:-0.5}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --no-check-certificate -O /dev/null https://127.0.0.1:$$HTTPS_PORT/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

  bootstrap:
    profiles: [setup]
    image: ${BACKUP_IMAGE}
    entrypoint: ["python", "/workspace/scripts/self_hosted_bootstrap.py"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
    volumes:
      - ${SOURCE_DIR}:/workspace:ro
      - ${STATE_DIR}/initial-admin.json:/run/bootstrap/initial-admin.json:ro
    read_only: true
    tmpfs: ["/tmp:size=32m"]
    mem_limit: 256m

  resource-init:
    profiles: [setup]
    image: ${BACKUP_IMAGE}
    user: "0:0"
    entrypoint: ["python", "/workspace/infra/self-hosted/resource_init.py"]
    environment:
      VIDEO_WORKER_SECRET: ${VIDEO_WORKER_SECRET}
      RENDER_WORKER_SECRET: ${RENDER_WORKER_SECRET}
    volumes:
      - ${SOURCE_DIR}:/workspace:ro
      - ${STATE_DIR}/tls:/tls-in:ro
      - certificates:/certs
      - worker-secrets:/secrets
      - media:/media
      - scheduler-alerts:/alerts
    read_only: true
    network_mode: none

  scheduler: &scheduler
    <<: *common
    profiles: [execution]
    image: ${SCHEDULER_IMAGE}
    user: "65534:10001"
    init: true
    read_only: true
    depends_on: {proxy: {condition: service_healthy}}
    environment: &scheduler-environment
      SUPABASE_URL: ${PUBLIC_ORIGIN}
      VIDEO_WORKER_SECRET_FILE: /run/secrets/video_worker_secret
      PRODUCTION_WORKER_ENABLED: "true"
      VIDEO_WORKER_INTERVAL_SECONDS: 10
      VIDEO_WORKER_CONCURRENCY: 4
      VIDEO_WORKER_TIMEOUT_SECONDS: 150
      VIDEO_WORKER_STATE_FILE: /tmp/scheduler.json
      VIDEO_WORKER_ALERT_FILE: /var/lib/shopro/scheduler-alerts.json
      SELF_HOSTED_BACKEND_ORIGIN: ${PUBLIC_ORIGIN}
      SELF_HOSTED_BACKEND_IPS: ${BACKEND_ALLOWED_IPS:-${BACKEND_IP}}
      SELF_HOSTED_CA_FILE: /certs/ca.crt
    extra_hosts: ["${PUBLIC_HOST}:${BACKEND_IP}"]
    volumes: ["worker-secrets:/run/secrets:ro", "certificates:/certs:ro", "scheduler-alerts:/var/lib/shopro"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=2m,uid=65534,gid=10001"]
    cap_drop: [ALL]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    stop_grace_period: 160s
    healthcheck:
      test: ["CMD", "python", "/app/run_video_worker.py", "--healthcheck"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 6

  maintenance:
    <<: *scheduler
    command: ["python", "/app/run_video_worker.py", "--daemon", "--maintenance"]
    environment:
      <<: *scheduler-environment
      VIDEO_WORKER_CONCURRENCY: 1
      VIDEO_WORKER_STATE_FILE: /tmp/maintenance.json
      VIDEO_WORKER_ALERT_FILE: /var/lib/shopro/maintenance-alerts.json

  renderer:
    <<: *common
    profiles: [execution]
    image: ${RENDERER_IMAGE}
    deploy:
      replicas: ${RENDERER_REPLICAS:-1}
    init: true
    read_only: true
    depends_on: {proxy: {condition: service_healthy}}
    environment:
      SUPABASE_URL: ${PUBLIC_ORIGIN}
      RENDER_WORKER_SECRET_FILE: /run/secrets/render_worker_secret
      RENDER_WORKSPACE_DIR: /work
      RENDER_ENCODER_THREADS: ${RENDER_ENCODER_THREADS:-2}
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      RENDER_MEDIA_HOSTS: ${RENDER_MEDIA_HOSTS:-}
      SELF_HOSTED_BACKEND_ORIGIN: ${PUBLIC_ORIGIN}
      SELF_HOSTED_BACKEND_IPS: ${BACKEND_ALLOWED_IPS:-${BACKEND_IP}}
      SELF_HOSTED_CA_FILE: /certs/ca.crt
    extra_hosts: ["${PUBLIC_HOST}:${BACKEND_IP}"]
    volumes: ["worker-secrets:/run/secrets:ro", "certificates:/certs:ro", "media:/work"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,uid=10001,gid=10001"]
    cap_drop: [ALL]
    mem_limit: ${RENDERER_MEMORY:-4g}
    cpus: ${RENDERER_CPUS:-2}
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD", "python", "/app/main.py", "--healthcheck"]
      interval: 10s
      timeout: 5s
      start_period: 45s
      retries: 6

  mcp:
    <<: *common
    profiles: [execution]
    image: ${MCP_IMAGE}
    init: true
    read_only: true
    environment:
      SUPABASE_URL: ${PUBLIC_ORIGIN}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      HOST: 0.0.0.0
      PORT: 8080
      MCP_ALLOWED_HOSTS: ${PUBLIC_HOST},${PUBLIC_HOST}:${HTTPS_PORT},127.0.0.1:8080
      MCP_MAX_CONCURRENT: ${MCP_MAX_CONCURRENT:-16}
      SELF_HOSTED_BACKEND_ORIGIN: ${PUBLIC_ORIGIN}
      SELF_HOSTED_BACKEND_IPS: ${BACKEND_ALLOWED_IPS:-${BACKEND_IP}}
      SELF_HOSTED_CA_FILE: /certs/ca.crt
    extra_hosts: ["${PUBLIC_HOST}:${BACKEND_IP}"]
    volumes: ["certificates:/certs:ro"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m,uid=65534,gid=65534"]
    cap_drop: [ALL]
    mem_limit: ${MCP_MEMORY:-384m}
    cpus: ${MCP_CPUS:-1}
    stop_grace_period: 180s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  acceptance:
    profiles: [setup]
    image: ${BACKUP_IMAGE}
    entrypoint: ["python", "/workspace/tests/self_hosted_acceptance.py"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SUPABASE_URL: ${PUBLIC_ORIGIN}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      VIDEO_WORKER_SECRET: ${VIDEO_WORKER_SECRET}
    extra_hosts: ["${PUBLIC_HOST}:${BACKEND_IP}"]
    volumes:
      - ${SOURCE_DIR}:/workspace:ro
      - ${STATE_DIR}/tls/ca.crt:/run/tls/ca.crt:ro
      - ${STATE_DIR}/fixtures:/fixtures:ro
      - ${STATE_DIR}/initial-admin.json:/run/bootstrap/initial-admin.json:ro
    read_only: true
    tmpfs: ["/tmp:size=32m"]
    mem_limit: 256m

volumes:
  postgres:
    name: ${COMPOSE_PROJECT_NAME}-postgres
  storage:
  deno-cache:
  certificates:
  worker-secrets:
  media:
  scheduler-alerts:
networks:
  default:
    ipam: {config: [{subnet: "${DOCKER_SUBNET}", ip_range: "${DOCKER_IP_RANGE:-${DOCKER_SUBNET}}"}]}
