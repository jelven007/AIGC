services:
  renderer:
    build:
      context: ../..
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      SUPABASE_URL: ${SUPABASE_URL:?请配置自己的BaaS地址}
      RENDER_WORKER_SECRET_FILE: /run/secrets/render_worker_secret
      RENDER_WORKSPACE_DIR: /work
      RENDER_MEDIA_HOSTS: ${RENDER_MEDIA_HOSTS:-}
    secrets: [render_worker_secret]
    volumes:
      - type: bind
        source: ${RENDER_WORKSPACE_PATH:?请配置专用磁盘目录并赋予10001用户权限}
        target: /work
    tmpfs:
      - /tmp:size=64M,uid=10001,gid=10001
    mem_limit: 4g
    cpus: 2
    pids_limit: 256
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD", "python", "main.py", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
secrets:
  render_worker_secret:
    file: ./render_worker_secret
